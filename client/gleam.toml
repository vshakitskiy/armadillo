name = "client"
version = "1.0.0"
target = "javascript"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
lustre = ">= 5.7.0 and < 6.0.0"
rsvp = ">= 2.0.0 and < 3.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
shared = { path = "../shared" }
gleam_json = ">= 3.1.0 and < 4.0.0"
formal = ">= 3.0.1 and < 4.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = ">= 2.3.6 and < 3.0.0"

[tools.lustre.dev]
host = "0.0.0.0"
port = 80
proxy = { from = "/api", to = "http://192.168.1.41:3000/api" }

[tools.lustre.html]
links = [
    { rel = "icon", type = "image/x-icon", href = "/favicon.ico", size = "32x32" },
]
title = "Armadillo"

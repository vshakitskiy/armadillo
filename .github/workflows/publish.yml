name: Publish container image

on:
  push:
    tags:
      - v*

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: docker build . --tag armadillo

      - name: Push image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/armadillo
          TAG=${{ github.ref_name }}
          docker tag armadillo "$IMAGE:$TAG"
          docker tag armadillo "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
